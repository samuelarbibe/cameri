name: cameri

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cameri
      POSTGRES_PASSWORD: cameri
      POSTGRES_DB: cameri
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cameri"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for traces, videos and screenshots. The server presigns
  # against this so attachment bytes never pass through the API.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cameri
      MINIO_ROOT_PASSWORD: cameri-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
