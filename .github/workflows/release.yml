name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch, minor, major, or an explicit version like 1.2.0"
        required: true
        default: patch
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: v${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      - run: node scripts/check-trusted-publishing.mjs

      - id: version
        env:
          BUMP: ${{ inputs.version }}
        run: echo "value=$(node scripts/set-version.mjs "$BUMP")" >> "$GITHUB_OUTPUT"

      - run: pnpm build
      - run: pnpm publish -r --access public --no-git-checks

      - name: Tag
        env:
          TAG: v${{ steps.version.outputs.value }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

  image:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.publish.outputs.version }}
            type=semver,pattern={{version}},value=${{ needs.publish.outputs.version }}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  announce:
    needs: [publish, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
