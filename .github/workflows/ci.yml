name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that ships must run on the oldest supported Node.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.10", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter "./packages/*" build
      - run: pnpm --filter @camerihq/server build

  # The image is what people actually deploy, and it builds differently from
  # `pnpm build` — a pruned production install, no dev dependencies, alpine.
  # Building it here means that breaks in a pull request rather than on `main`.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # One platform: this job answers "does it build", and the release
          # workflow is where the cross-platform cost is worth paying.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The web bundle is built with Vite, which needs a newer Node than the
  # runtime does. The output is static, so this only constrains contributors.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @camerihq/web build
