<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cameri</title>
    <!--
      Runs before first paint so the page never flashes the wrong theme while
      React boots. Blocking (no defer/async) on purpose. The storage key and
      the "dark" default must match src/components/theme-provider.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("cameri-theme") || "dark";
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.classList.toggle("light", !dark);
        } catch (e) {
          // Storage blocked. The class="dark" already on <html> stands.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
